@if (items.length > 0) {
  <div class="mt-3 border-gray-300 bg-white overflow-hidden">
    <div class="summary-bar flex flex-wrap items-center justify-between px-4 py-2.5 bg-gray-100 border-b border-gray-300">
      <span class="summary-title">
        {{ title }} ({{ items.length }})
      </span>
      <span class="summary-total tabular-nums">
        Total: {{ total | number: '1.2-2' }} {{ currencyCode }}
      </span>
    </div>

    <div
      class="relative summary-grid p-2"
      (mouseleave)="onRowLeave()"
    >
      <div
        class="hover-strip pointer-events-none"
        [style.opacity]="hoverStrip.visible ? 1 : 0"
        [style.transform]="
          'translate(' + hoverStrip.x + 'px, ' + hoverStrip.y + 'px)'
        "
        [style.width.px]="hoverStrip.width"
        [style.height.px]="hoverStrip.height"
      ></div>

      @for (item of items; track item.name) {
        <div
          class="summary-row relative z-10 flex items-center justify-between gap-2 px-2 py-1 text-xs cursor-pointer select-none"
          (mouseenter)="onRowEnter($event, item.name)"
          (mousemove)="onRowMove($event)"
        >
          <div class="flex items-center gap-1.5 min-w-0">
            <span
              class="inline-block w-2.5 h-2.5 rounded-full shrink-0"
              [style.background-color]="item.color"
            ></span>
            <span class="wrap-normal" [title]="item.name">{{ item.name }}</span>
          </div>

          <div class="flex items-center gap-2 shrink-0 tabular-nums">
            <span class="font-semibold">
              {{ item.total | number: '1.2-2' }} {{ currencyCode }}
            </span>
            &nbsp;&nbsp;
            <span class="text-gray-500 w-10 text-right">
              {{ item.percentage | number: '1.1-1' }}%
            </span>
          </div>
        </div>
      }
    </div>
  </div>
}
