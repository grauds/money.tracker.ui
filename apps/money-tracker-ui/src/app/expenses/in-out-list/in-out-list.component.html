<div class="back-area">
  <div class="jumbotron summary-header">
    <lib-newspaper-header
      [title]="'Reselling Statistics'"
      [subtitle]="'Things are bought and then sold, was it profitable?'"
    >
    </lib-newspaper-header>
    <div class="product-info" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; font-family: system-ui, -apple-system, sans-serif;">

      <lib-entity-balance-info
        [loading]="loading"
        [expensesSum]="-1 * totals.negative"
        [incomeSum]="totals.positive"
        [currency]="currency"
      ></lib-entity-balance-info>

    </div>
  </div>
</div>

<ng-template #expensesTable let-entities="entities">
  <table
    mat-table
    [dataSource]="entities"
  >
    <ng-container matColumnDef="commodity.name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let element">
        @if (element.commodity && element.commodityLink) {
          <app-entity-thumbnail
            [entity]="element.commodity"
            [entityName]="'commodities'"
            [currentLayout]="'list'"
          ></app-entity-thumbnail>
        }
      </td>
    </ng-container>

    <ng-container matColumnDef="delta">
      <th mat-header-cell *matHeaderCellDef>Delta</th>
      <td mat-cell *matCellDef="let element">
        <span [style.color]="element.delta >= 0 ? 'green' : 'darkred'">
          <b>{{ element.delta | currencySpace : element.moneyType?.code : 'symbol' }}</b>
        </span>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</ng-template>

<div style="background: white;">
  <app-entity-list
    [searchServiceOverride]="inOutService"
    [tableTemplate]="expensesTable"
  >
  </app-entity-list>

</div>
