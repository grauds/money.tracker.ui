<div class="back-area">
  <div class="jumbotron summary-header">
    <lib-newspaper-header
      [title]="'Budget Balance Monthly'"
      [subtitle]="'The balance of your monthly budget for the selected period with total savings amount.'"
    >
    </lib-newspaper-header>
  </div>

</div>

<mat-paginator
  [length]="total"
  [pageSize]="limit"
  [pageSizeOptions]="[
    12, 24, 36, 42, 48, 54, 60, 72, 78, 84, 90, 102, 108, 120, 240, 360
  ]"
  [pageIndex]="n"
  (page)="setCurrentPage($event.pageIndex, $event.pageSize)"
  aria-label="Select page"
  [disabled]="loading"
  showFirstLastButtons
>
</mat-paginator>

<div echarts [options]="chart" class="chart" [loading]="loading"></div>

<mat-paginator
  [length]="total"
  [pageSize]="limit"
  [pageSizeOptions]="[
    12, 24, 36, 42, 48, 54, 60, 72, 78, 84, 90, 102, 108, 120, 240, 360
  ]"
  [pageIndex]="n"
  (page)="setCurrentPage($event.pageIndex, $event.pageSize)"
  aria-label="Select page"
  [disabled]="loading"
  showFirstLastButtons
>
</mat-paginator>
