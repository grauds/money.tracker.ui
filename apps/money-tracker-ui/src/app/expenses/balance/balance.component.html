<div class="back-area">
  <div class="jumbotron summary-header">
    <lib-newspaper-header
      [title]="'Monthly Balances'"
      [subtitle]="'Track cash total and cash flow between accounts'"
    >
    </lib-newspaper-header>

  </div>

</div>

<div
  echarts
  [options]="chart"
  (chartInit)="onChartInit($event)"
  [loading]="loading"
  class="balance-chart"
></div>

<div class="date-picker">
  <app-date-range-selector
    [loading]="loading"
    (startDate$)="updateStartDate($event)"
    (endDate$)="updateEndDate($event)"
  ></app-date-range-selector>
</div>
