@if (this.infoAbout) {
  <h4 class="header" [hidden]="headerLoading">
    <span>Recorded transactions' time span
    </span>
    <span
    ><b>starts:</b>
      {{ getStartDate() }}
    </span>
    <span
    ><b>, ends:</b>
      {{ getLastDate() }}
    </span>
  </h4>
}

<h4 class="header" [hidden]="!headerLoading">
  <span><b>Loading...</b></span>
</h4>

<div class="back-area">
  <div class="jumbotron summary-header">
    <lib-newspaper-header
      [title]="'Expenses Groups Trends'"
      [subtitle]="' Track how the expenses categories are distributed over months'"
    >
    </lib-newspaper-header>

    <div class="product-info" style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 20px; font-family: system-ui, -apple-system, sans-serif;">
      <lib-entity-balance-info
        [loading]="loading"
        [statsLoading]="statsLoading"
        [expensesSum]="totalVisibleArea"
        [incomeSum]="0"
        [currency]="currency"
      ></lib-entity-balance-info>
    </div>

  </div>

</div>

<div
  echarts
  [options]="chart"
  (chartInit)="onChartInit($event)"
  [loading]="loading"
  class="chart"
></div>

<div class="date-picker">
  <app-date-range-selector
    [loading]="loading"
    (startDate$)="updateStartDate($event)"
    (endDate$)="updateEndDate($event)"
  ></app-date-range-selector>

  <mat-checkbox
    class="filter"
    [(ngModel)]="showGroups"
    (change)="onFilterEvent($event.checked)"
  >
    Break down to groups
  </mat-checkbox>

</div>

  <!-- Multi-Column Grid with Mouse-Following Hover Strip -->
  <app-multirow-table
    title="Visible Sources"
    [items]="visibleSeriesTotals"
    [total]="totalVisibleArea"
    [currencyCode]="selectedCurrencyCode"
    (rowHover)="onSeriesHover($event)"
  ></app-multirow-table>
