<div class="dashboard-container">
  <section class="stats-strip">
    <app-dashboard-stats-card
      title="INCOME"
      [value]="totalIncome"
      [currencyCode]="currency?.code ?? ''"
      [positive]="true"
      [loading]="totalIncomeLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="EXPENSES"
      [value]="totalExpense"
      [currencyCode]="currency?.code ?? ''"
      [negative]="true"
      [loading]="totalExpenseLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="NET SAVINGS"
      [value]="netSavings"
      [currencyCode]="currency?.code ?? ''"
      [subtitle]="savingsSubtitle"
      [positive]="(netSavings ?? 0) > 0"
      [negative]="(netSavings ?? 0) < 0"
      [showSign]="true"
      [loading]="netSavingsLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="LAST UPDATED"
      [info]="getLastDate()"
      [highlight]="true"
      [loading]="infoLoading"
    ></app-dashboard-stats-card>
  </section>

  <div class="analytics-grid">
    <app-cash-flow-pool
      class="grid-pool"
      [incomes]="incomeByCurrency"
      [expenses]="expenseByCurrency"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="incomeByCurrencyLoading || expenseByCurrencyLoading"
    ></app-cash-flow-pool>

    <app-category-ranking-card
      title="Income By Organization"
      type="income"
      [items]="incomeByOrganization"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="incomeByOrganizationLoading"
    ></app-category-ranking-card>

    <app-category-ranking-card
      title="Expense By Category"
      type="expense"
      [items]="expenseByCategory"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="expenseByCategoryLoading"
    ></app-category-ranking-card>

  </div>
</div>
