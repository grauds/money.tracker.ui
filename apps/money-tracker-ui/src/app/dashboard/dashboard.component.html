<div class="dashboard-container">
  <section class="stats-strip">
    <app-dashboard-stats-card
      title="BALANCE"
      [subtitle]="'All accounts included'"
      [value]="total"
      [currencyCode]="currency?.code ?? ''"
      [positive]="total > 0"
      [loading]="totalsLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="WEEK DELTA"
      [value]="total - totalWeekAgo"
      [subtitle]="'Over the last 7 days'"
      [currencyCode]="currency?.code ?? ''"
      [negative]="(total - totalWeekAgo) < 0"
      [loading]="totalsHistoryLoading && totalsLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="LAST UPDATED"
      [info]="getLastDate()"
      [highlight]="true"
      [loading]="infoLoading"
    ></app-dashboard-stats-card>
  </section>

  <div class="analytics-grid">
    <app-cash-flow-pool
      class="grid-pool"
      [incomes]="incomeByCurrency"
      [expenses]="expenseByCurrency"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="incomeByCurrencyLoading || expenseByCurrencyLoading"
    ></app-cash-flow-pool>

    <app-category-ranking-card
      title="Top Income"
      entityLabel="NAME"
      type="income"
      [items]="incomeByOrganization"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="incomeByOrganizationLoading"
    ></app-category-ranking-card>

    <app-category-ranking-card
      title="Top Expense Categories"
      entityLabel="NAME"
      type="expense"
      [maxLimit]="50"
      [items]="expenseByCategory"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="expenseByCategoryLoading"
    ></app-category-ranking-card>

  </div>
</div>

<div class="footer"></div>
