<div class="dashboard-container">
  <section class="stats-strip">
    <app-dashboard-stats-card
      title="BALANCE"
      [subtitle]="'All accounts included'"
      [value]="total"
      [currencyCode]="currency?.code ?? ''"
      [positive]="total > 0"
      [loading]="totalsLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="WEEK DELTA"
      [value]="total - totalWeekAgo"
      [subtitle]="'Over the last 7 days'"
      [currencyCode]="currency?.code ?? ''"
      [negative]="(total - totalWeekAgo) < 0"
      [loading]="totalsHistoryLoading && totalsLoading"
    ></app-dashboard-stats-card>

    <app-dashboard-stats-card
      title="LAST UPDATED"
      [info]="getLastDate()"
      [highlight]="true"
      [loading]="infoLoading"
    ></app-dashboard-stats-card>
  </section>

  <div class="analytics-grid">
    <app-cash-flow-pool
      class="grid-pool"
      [incomes]="incomeByCurrency"
      [expenses]="expenseByCurrency"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="incomeByCurrencyLoading || expenseByCurrencyLoading"
    ></app-cash-flow-pool>

    <app-category-ranking-card
      title="Top Income"
      entityLabel="NAME"
      type="income"
      [items]="activeIncomeItems()"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="activeIncomeLoading()"
    >
      <div header-actions class="segmented-toggle" role="group" aria-label="Group income by">
        <button
          type="button"
          class="toggle-btn"
          [class.active]="incomeGroupBy() === 'category'"
          (click)="incomeGroupBy.set('category')"
        >
          Categories
        </button>
        <button
          type="button"
          class="toggle-btn"
          [class.active]="incomeGroupBy() === 'organization'"
          (click)="incomeGroupBy.set('organization')"
        >
          Places
        </button>
      </div>
    </app-category-ranking-card>


    <app-category-ranking-card
      [title]="activeExpenseTitle()"
      entityLabel="NAME"
      type="expense"
      [maxLimit]="50"
      [items]="activeExpenseItems()"
      [baseCurrency]="currency?.code ?? 'USD'"
      [loading]="activeExpenseLoading()"
    ><div header-actions class="segmented-toggle" role="group" aria-label="Group expenses by">
        <button
          type="button"
          class="toggle-btn"
          [class.active]="expenseGroupBy() === 'category'"
          (click)="expenseGroupBy.set('category')"
        >
          Categories
        </button>
        <button
          type="button"
          class="toggle-btn"
          [class.active]="expenseGroupBy() === 'organization'"
          (click)="expenseGroupBy.set('organization')"
        >
          Places
        </button>
      </div>
    </app-category-ranking-card>

  </div>
</div>

<div class="footer"></div>
