@if (entity) {
  <div class="group-page">
    <app-breadcrumbs [path]="path"></app-breadcrumbs>

    <div class="workspace-grid">
      <aside class="panel-card sidebar-panel">

        <header class="summary-banner">

          <div>
            <span>Commodity Group</span>
            <h1 style="margin: 0; font-size: 1.5rem; font-weight: 600; color: #212529; letter-spacing: -0.2px;">{{ entity.name }}</h1>
            @if (entity.description) {
              <p>{{ entity.description }}</p>
            }
          </div>
          <div class="summary-metrics">
            <lib-entity-balance-info
              [loading]="loading"
              [statsLoading]="statsLoading"
              [expensesSum]="expensesSum"
              [incomeSum]="incomeSum"
              [currency]="currency"
            ></lib-entity-balance-info>
          </div>
        </header>

        <div class="panel-header" [hidden]="!children || children.length === 0">
          <div class="panel-header-main">
            <h2 class="panel-title">Subgroups</h2>
            @if (children && children.length > 0) {
              <span class="panel-count">{{ children.length }}</span>
            }
          </div>
          <span class="panel-subtitle">Child groups and hierarchy</span>
        </div>

        <div class="panel-body">
          <app-entity-list
            [updateRouterState]="false"
            (loading$)="setLoading($event)"
            [cookieStateKey]="'commodity-group-subgroups'"
            [searchRequest]="{
            queryArguments: getQueryArguments(),
            queryName: 'recursiveByParentId'
          }"
            (entitiesChange$)="setEntities($event)"
            [sort]="getSort()"
          ></app-entity-list>
        </div>
      </aside>

      <main class="panel-card main-panel">
        <div class="panel-header">
          <div class="panel-header-main">
            <h2 class="panel-title">Group Commodities</h2>
          </div>
          <span class="panel-subtitle">List of this group and subgroups commodities</span>
        </div>

        <div class="panel-body">
          <app-commodity-group-commodities
            [id]="id"
          ></app-commodity-group-commodities>
        </div>
      </main>

    </div>

  </div>
}
