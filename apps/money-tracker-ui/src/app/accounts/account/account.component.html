@if (entity) {
  <div class="page">
    <app-breadcrumbs [path]="path"></app-breadcrumbs>

    <header class="jumbotron summary-header">

      <div class="product-media" style="flex-shrink: 0; background: #ffffff; padding: 0 1px 0 0; border: 1px solid #dee2e6; border-radius: 6px;">
        <app-photo-uploader
          [entityName]="'accounts'"
          [entityId]="id"
          [extraPath]="'main'"
        ></app-photo-uploader>
      </div>

      <div class="ledger-grid">
        <div class="summary-details">
          <h2 style="margin: 0; font-size: 1.5rem; font-weight: 600; color: #212529; letter-spacing: -0.2px;">
            {{ !loading ? (entity ? entity.name : 'Not loaded') : 'Loading...' }}
          </h2>
        </div>

        <lib-entity-balance-info
          [loading]="loading"
          [expensesSum]="expensesSum"
          [incomeSum]="incomeSum"
          [currency]="currency"
        ></lib-entity-balance-info>

        @if (entity.description) {
          <div class="product-description" style="margin-top: 4px; border-top: 1px solid #f1f3f5; padding-top: 16px;">
            <h4 style="margin: 0 0 8px 0; font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: #868e96;">Description</h4>
            <div style="max-height: 140px; overflow-y: auto; font-size: 0.925rem; color: #495057; line-height: 1.6; padding-right: 8px;">
              {{ entity.description }}
            </div>
          </div>
        }
      </div>
    </header>

    @if (this.expenses.length > 0) {
      <div class="d-flex align-items: center; margin: 32px; padding-left: 12px; margin-left: 20px; border-left: 4px solid #0d6efd;">
        <lib-newspaper-header
          [title]="'Price & Analytics Trends'"
          [subtitle]="'Historical data and purchase distribution'"
        >
        </lib-newspaper-header>
      </div>
    }

    <app-entity-expenses
      [expenseService]="expenseService"
      [cookieStateKey]="'account-expense'"
      [queryArguments]="getQueryArguments()"
      [queryName]="'account'"
      (loadingChanged)="setLoading($event)"
      (entitiesChanged)="setExpenses($event)"
    ></app-entity-expenses>

    @if (this.income.length > 0) {
      <div class="d-flex align-items: center; margin: 32px; padding-left: 12px; border-left: 4px solid #0d6efd;">
        <lib-newspaper-header
          [title]="'Income & Analytics Trends'"
          [subtitle]="'Historical data and income distribution'"
        >
        </lib-newspaper-header>
      </div>
    }

    <app-entity-income
      [incomeService]="incomeService"
      [cookieStateKey]="'account-income'"
      [queryArguments]="getQueryArguments()"
      [queryName]="'account'"
      (loadingChanged)="setLoading($event)"
      (entitiesChanged)="setIncome($event)"
    >
    </app-entity-income>
  </div>
}
