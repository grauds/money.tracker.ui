<div class="back-area">
  <div class="jumbotron summary-header">
    <lib-newspaper-header
      [title]="'Income Trends And Profile'"
      [subtitle]="'Historical data on income sources'"
    >
    </lib-newspaper-header>
  </div>

</div>

<div echarts [options]="chart" class="income-chart" [loading]="loading"></div>

<div class="date-picker">
  <app-date-range-selector
    [loading]="loading"
    (startDate$)="updateStartDate($event)"
    (endDate$)="updateEndDate($event)"
  ></app-date-range-selector>

</div>
